  <rect class="tile" x="0.5" y="0.5" width="177" height="23" rx="11.5" stroke-width="1"/>
  <g class="icon" transform="translate(12 6.0) scale(0.75)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 L14 14"/></g>
  <text class="label" x="32" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" textLength="72.5" lengthAdjust="spacing">Super Linter</text>
  <text class="value" x="108.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" textLength="43.1" lengthAdjust="spacing">passing</text>
  <circle class="dot-ok" cx="162.6" cy="12.0" r="3.0"/>
</svg>
