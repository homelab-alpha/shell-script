<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 24" width="178" height="24" role="img" aria-label="Super Linter: passing">
  <title>Super Linter: passing</title>
  <style>
    .tile { fill: #eaeef2; stroke: #c3c9cf; }
    .icon { stroke: #5c5c61; }
    .label { fill: #5c5c61; }
    .value { fill: #000000; font-variant-numeric: tabular-nums; }
    .dot-now { fill: #0062cc; }
    .dot-ok { fill: #1b7a34; }
    .dot-fail { fill: #c4161c; }
    .dot-none { stroke: #5c5c61; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #151b23; stroke: #353a3f; }
