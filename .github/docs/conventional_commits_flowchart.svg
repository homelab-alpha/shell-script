<svg xmlns="http://www.w3.org/2000/svg" width="790" height="1220" viewBox="0 0 790 1220" role="img">
<title>Choose the Conventional Commits type</title>
<desc>Answer the questions from top to bottom and take the first type with the answer yes. The last fallback is chore.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
  .bg { fill: #ffffff; }
  .q rect { fill: #eeedfe; stroke: #534ab7; } .q text { fill: #26215c; }
  .t rect { fill: #e1f5ee; stroke: #0f6e56; }
  .t text { fill: #04342c; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .s rect { fill: #f1efe8; stroke: #5f5e5a; } .s text { fill: #2c2c2a; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .dash { stroke-dasharray: 5 4; }
  .lbl { fill: #3d3d3a; font-size: 12px; }
  text.note, .t text.note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                            font-size: 12px; }
  .step { fill: #5f5e5a; font-size: 12px; font-weight: 600; }
  .head { fill: #73726c; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .q rect { fill: #3c3489; stroke: #afa9ec; } .q text { fill: #eeedfe; }
    .t rect { fill: #085041; stroke: #5dcaa5; } .t text { fill: #e1f5ee; }
    .s rect { fill: #444441; stroke: #b4b2a9; } .s text { fill: #f1efe8; }
    .arr { stroke: #9c9a92; } .head { fill: #9c9a92; } .lbl { fill: #c2c0b6; } .step { fill: #b4b2a9; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="790" height="1220"/>
<text class="step" x="40" y="16">STEP 1: CHOOSE THE TYPE</text>
<g class="s"><rect x="70.0" y="30" width="260" height="52" rx="20" stroke-width="1.5"/>
<text x="200.0" y="47.0" text-anchor="middle" dy="0.35em">Which type?</text>
<text class="note" x="200.0" y="65.0" text-anchor="middle" dy="0.35em">Take the first question with Yes</text>
</g>
<line class="arr" x1="200.0" y1="82" x2="200.0" y2="108" marker-end="url(#arrow)"/>
<g class="q"><rect x="40" y="110" width="320" height="44" rx="8" stroke-width="1.5"/><text x="200.0" y="132.0" text-anchor="middle" dy="0.35em">Fixes a bug?</text></g>
<line class="arr" x1="360" y1="132.0" x2="448" y2="132.0" marker-end="url(#arrow)"/>
<text class="lbl" x="405.0" y="124.0" text-anchor="middle">Yes</text>
<g class="t"><rect x="450" y="114.0" width="120" height="36" rx="8" stroke-width="1.5"/><text x="510.0" y="132.0" text-anchor="middle" dy="0.35em">fix</text></g>
<line class="arr" x1="200.0" y1="154" x2="200.0" y2="180" marker-end="url(#arrow)"/>
<text class="lbl" x="208.0" y="172.0">No</text>
<line class="arr dash" x1="570" y1="132.0" x2="638" y2="132.0" marker-end="url(#arrow)"/>
<text class="lbl" x="605.0" y="124.0" text-anchor="middle">security</text>
<g class="t"><rect x="640" y="114.0" width="130" height="36" rx="8" stroke-width="1.5"/><text x="705.0" y="132.0" text-anchor="middle" dy="0.35em">fix(security)</text></g>
<g class="q"><rect x="40" y="182" width="320" height="44" rx="8" stroke-width="1.5"/><text x="200.0" y="204.0" text-anchor="middle" dy="0.35em">Adds or changes a feature?</text></g>
<line class="arr" x1="360" y1="204.0" x2="448" y2="204.0" marker-end="url(#arrow)"/>
<text class="lbl" x="405.0" y="196.0" text-anchor="middle">Yes</text>
<g class="t"><rect x="450" y="186.0" width="120" height="36" rx="8" stroke-width="1.5"/><text x="510.0" y="204.0" text-anchor="middle" dy="0.35em">feat</text></g>
<line class="arr" x1="200.0" y1="226" x2="200.0" y2="252" marker-end="url(#arrow)"/>
<text class="lbl" x="208.0" y="244.0">No</text>
<g class="q"><rect x="40" y="254" width="320" height="44" rx="8" stroke-width="1.5"/><text x="200.0" y="276.0" text-anchor="middle" dy="0.35em">Undoes an earlier commit?</text></g>
<line class="arr" x1="360" y1="276.0" x2="448" y2="276.0" marker-end="url(#arrow)"/>
<text class="lbl" x="405.0" y="268.0" text-anchor="middle">Yes</text>
<g class="t"><rect x="450" y="258.0" width="120" height="36" rx="8" stroke-width="1.5"/><text x="510.0" y="276.0" text-anchor="middle" dy="0.35em">revert</text></g>
<line class="arr" x1="200.0" y1="298" x2="200.0" y2="324" marker-end="url(#arrow)"/>
<text class="lbl" x="208.0" y="316.0">No</text>
<g class="q"><rect x="40" y="326" width="320" height="44" rx="8" stroke-width="1.5"/><text x="200.0" y="348.0" text-anchor="middle" dy="0.35em">Only improves performance?</text></g>
<line class="arr" x1="360" y1="348.0" x2="448" y2="348.0" marker-end="url(#arrow)"/>
<text class="lbl" x="405.0" y="340.0" text-anchor="middle">Yes</text>
<g class="t"><rect x="450" y="330.0" width="120" height="36" rx="8" stroke-width="1.5"/><text x="510.0" y="348.0" text-anchor="middle" dy="0.35em">perf</text></g>
<line class="arr" x1="200.0" y1="370" x2="200.0" y2="396" marker-end="url(#arrow)"/>
<text class="lbl" x="208.0" y="388.0">No</text>
<g class="q"><rect x="40" y="398" width="320" height="44" rx="8" stroke-width="1.5"/><text x="200.0" y="420.0" text-anchor="middle" dy="0.35em">Only changes formatting?</text></g>
<line class="arr" x1="360" y1="420.0" x2="448" y2="420.0" marker-end="url(#arrow)"/>
<text class="lbl" x="405.0" y="412.0" text-anchor="middle">Yes</text>
<g class="t"><rect x="450" y="402.0" width="120" height="36" rx="8" stroke-width="1.5"/><text x="510.0" y="420.0" text-anchor="middle" dy="0.35em">style</text></g>
<line class="arr" x1="200.0" y1="442" x2="200.0" y2="468" marker-end="url(#arrow)"/>
<text class="lbl" x="208.0" y="460.0">No</text>
<g class="q"><rect x="40" y="470" width="320" height="44" rx="8" stroke-width="1.5"/><text x="200.0" y="492.0" text-anchor="middle" dy="0.35em">Only changes tests?</text></g>
<line class="arr" x1="360" y1="492.0" x2="448" y2="492.0" marker-end="url(#arrow)"/>
<text class="lbl" x="405.0" y="484.0" text-anchor="middle">Yes</text>
<g class="t"><rect x="450" y="474.0" width="120" height="36" rx="8" stroke-width="1.5"/><text x="510.0" y="492.0" text-anchor="middle" dy="0.35em">test</text></g>
<line class="arr" x1="200.0" y1="514" x2="200.0" y2="540" marker-end="url(#arrow)"/>
<text class="lbl" x="208.0" y="532.0">No</text>
<g class="q"><rect x="40" y="542" width="320" height="44" rx="8" stroke-width="1.5"/><text x="200.0" y="564.0" text-anchor="middle" dy="0.35em">Only changes documentation?</text></g>
<line class="arr" x1="360" y1="564.0" x2="448" y2="564.0" marker-end="url(#arrow)"/>
<text class="lbl" x="405.0" y="556.0" text-anchor="middle">Yes</text>
<g class="t"><rect x="450" y="546.0" width="120" height="36" rx="8" stroke-width="1.5"/><text x="510.0" y="564.0" text-anchor="middle" dy="0.35em">docs</text></g>
<line class="arr" x1="200.0" y1="586" x2="200.0" y2="612" marker-end="url(#arrow)"/>
<text class="lbl" x="208.0" y="604.0">No</text>
<g class="q"><rect x="40" y="614" width="320" height="44" rx="8" stroke-width="1.5"/><text x="200.0" y="636.0" text-anchor="middle" dy="0.35em">Only changes the build setup?</text></g>
<line class="arr" x1="360" y1="636.0" x2="448" y2="636.0" marker-end="url(#arrow)"/>
<text class="lbl" x="405.0" y="628.0" text-anchor="middle">Yes</text>
<g class="t"><rect x="450" y="618.0" width="120" height="36" rx="8" stroke-width="1.5"/><text x="510.0" y="636.0" text-anchor="middle" dy="0.35em">build</text></g>
<line class="arr" x1="200.0" y1="658" x2="200.0" y2="684" marker-end="url(#arrow)"/>
<text class="lbl" x="208.0" y="676.0">No</text>
<g class="q"><rect x="40" y="686" width="320" height="44" rx="8" stroke-width="1.5"/><text x="200.0" y="708.0" text-anchor="middle" dy="0.35em">Only changes workflows or CI?</text></g>
<line class="arr" x1="360" y1="708.0" x2="448" y2="708.0" marker-end="url(#arrow)"/>
<text class="lbl" x="405.0" y="700.0" text-anchor="middle">Yes</text>
<g class="t"><rect x="450" y="690.0" width="120" height="36" rx="8" stroke-width="1.5"/><text x="510.0" y="708.0" text-anchor="middle" dy="0.35em">ci</text></g>
<line class="arr" x1="200.0" y1="730" x2="200.0" y2="756" marker-end="url(#arrow)"/>
<text class="lbl" x="208.0" y="748.0">No</text>
<g class="q"><rect x="40" y="758" width="320" height="44" rx="8" stroke-width="1.5"/><text x="200.0" y="780.0" text-anchor="middle" dy="0.35em">Restructures code, same behavior?</text></g>
<line class="arr" x1="360" y1="780.0" x2="448" y2="780.0" marker-end="url(#arrow)"/>
<text class="lbl" x="405.0" y="772.0" text-anchor="middle">Yes</text>
<g class="t"><rect x="450" y="762.0" width="120" height="36" rx="8" stroke-width="1.5"/><text x="510.0" y="780.0" text-anchor="middle" dy="0.35em">refactor</text></g>
<line class="arr" x1="200.0" y1="802" x2="200.0" y2="828" marker-end="url(#arrow)"/>
<text class="lbl" x="208.0" y="820.0">No</text>
<g class="t"><rect x="140.0" y="830" width="120" height="40" rx="8" stroke-width="1.5"/><text x="200.0" y="850.0" text-anchor="middle" dy="0.35em">chore</text></g>
<line class="arr dash" x1="20" y1="910" x2="770" y2="910"/>
<text class="step" x="40" y="946">STEP 2: MARK A BREAKING CHANGE</text>
<g class="s"><rect x="70.0" y="970" width="260" height="52" rx="20" stroke-width="1.5"/>
<text x="200.0" y="987.0" text-anchor="middle" dy="0.35em">Then, for every type</text>
<text class="note" x="200.0" y="1005.0" text-anchor="middle" dy="0.35em">including the one you chose above</text>
</g>
<line class="arr" x1="200.0" y1="1022" x2="200.0" y2="1048" marker-end="url(#arrow)"/>
<g class="q"><rect x="40" y="1050" width="320" height="52" rx="8" stroke-width="1.5"/>
<text x="200.0" y="1067.0" text-anchor="middle" dy="0.35em">Breaking change?</text>
<text class="note" x="200.0" y="1085.0" text-anchor="middle" dy="0.35em">Existing users must change something</text>
</g>
<line class="arr" x1="360" y1="1076.0" x2="448" y2="1076.0" marker-end="url(#arrow)"/>
<text class="lbl" x="405.0" y="1068.0" text-anchor="middle">Yes</text>
<g class="t"><rect x="450" y="1038.0" width="300" height="76" rx="8" stroke-width="1.5"/>
<text class="note" x="600.0" y="1058.0" text-anchor="middle" dy="0.35em">Add ! directly before the colon</text>
<text x="600.0" y="1076.0" text-anchor="middle" dy="0.35em">feat(api)!: remove the v1 API</text>
<text class="note" x="600.0" y="1094.0" text-anchor="middle" dy="0.35em">A BREAKING CHANGE: footer is optional</text>
</g>
<line class="arr" x1="200.0" y1="1102" x2="200.0" y2="1136" marker-end="url(#arrow)"/>
<text class="lbl" x="208.0" y="1124.0">No</text>
<g class="s"><rect x="70.0" y="1138" width="260" height="52" rx="20" stroke-width="1.5"/>
<text x="200.0" y="1155.0" text-anchor="middle" dy="0.35em">Done</text>
<text class="note" x="200.0" y="1173.0" text-anchor="middle" dy="0.35em">Keep the header without !</text>
</g>
</svg>
