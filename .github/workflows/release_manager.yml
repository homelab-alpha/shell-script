---
name: 🚀 Release Manager

# Publishes a release (README.md, "Option A", step 7). The inputs bump_type (testing, patch, minor,
# major) and release_type (alpha, beta, rc, release) decide the version, counted from the last tag;
# alpha, beta, and rc are prereleases. It writes the release notes from the text under [Unreleased]
# in CHANGELOG.md or, when that is empty, from the pull requests merged since the last tag. It
# creates the GitHub release and posts an announcement to GitHub Discussions (category
# "Announcements"). For release_type release it also opens a pull request that updates CHANGELOG.md
# and the version in package.json and package-lock.json; merge it after the release. Start Update
# Changelog by hand first. It runs by hand only, and has a dry run.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Which part of the version should be increased?"
        required: true
        type: choice
        default: testing
        options:
          - testing
          - patch
          - minor
          - major
      release_type:
        description: "Release type: alpha, beta, and rc are prereleases, release is Latest"
        required: true
        type: choice
        default: alpha
        options:
          - alpha
          - beta
          - rc
          - release
      post_announcement:
        description: "Post announcement to GitHub Discussions"
        required: true
        type: boolean
        default: true
      dry_run:
        description: "Simulation (do not push changes)"
        required: true
        type: boolean
        default: false

# No permission for the workflow as a whole. Each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 📦 Execute Release Process
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: write # Commit the changelog change, and create the release and its tag.
      discussions: write # Post the release announcement in Discussions.
      pull-requests: write # Open the pull request for the CHANGELOG.md change.

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      REVIEWER: ${{ github.repository_owner }}
      BUMP_TYPE: ${{ inputs.bump_type }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      DRY_RUN: ${{ inputs.dry_run }}
      POST_ANNOUNCEMENT: ${{ inputs.post_announcement }}

    steps:
      - name: 🏁 Notify start of process
        run: |
          echo "::notice title=Workflow started::🚀 Starting release process for $REPO"
          echo "::group::ℹ️ Execution Parameters"
          echo "Bump Type:         $BUMP_TYPE"
          echo "Release Type:      $RELEASE_TYPE"
          echo "Dry Run:           $DRY_RUN"
          echo "Post Announcement: $POST_ANNOUNCEMENT"
          echo "::endgroup::"

      - name: 🏗️ Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔢 Calculate new version
        id: versioning
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::group::🔄 Version calculation"

          # The last tag by version, with a prerelease (v0.1.0-rc.1) below its release
          # (v0.1.0) and alpha below beta below rc. The init baseline v0.0.0 is no release:
          # it ranks below every prerelease, so v0.0.0-alpha.1 is the last tag after it.
          LAST_TAG=$(git tag | python3 -c '
          import re
          import sys

          best, best_key = "", None
          for tag in sys.stdin.read().split():
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)(?:-([a-zA-Z]+)\.(\d+))?", tag)
              if not match:
                  continue
              version = tuple(int(match[i]) for i in (1, 2, 3))
              if match[4]:
                  rank = (0, match[4], int(match[5]))
              elif version == (0, 0, 0):
                  rank = (-1, "", 0)
              else:
                  rank = (1, "", 0)
              if best_key is None or (version, rank) > best_key:
                  best, best_key = tag, (version, rank)
          print(best)
          ')
          [[ -z "$LAST_TAG" ]] && LAST_TAG="v0.0.0"

          echo "Current tag: $LAST_TAG"

          if [[ "$LAST_TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-([a-zA-Z]+)\.([0-9]+))?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            STAGE_NAME="${BASH_REMATCH[5]:-}"
            STAGE_NUM="${BASH_REMATCH[6]:-0}"
          else
            echo "::warning title=Tag Format::⚠️ Tag $LAST_TAG is non-standard. Resetting to v0.0.0 logic."
            MAJOR=0; MINOR=0; PATCH=0; STAGE_NAME=""; STAGE_NUM=0
          fi

          case "$BUMP_TYPE" in
            major)   MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0; STAGE_NUM=0 ;;
            minor)   MINOR=$((MINOR + 1)); PATCH=0; STAGE_NUM=0 ;;
            patch)   PATCH=$((PATCH + 1)); STAGE_NUM=0 ;;
            testing)
              # Continue the prerelease of the last tag. A new stage (alpha to beta)
              # starts again at 1. Without a prerelease there is nothing to continue.
              if [[ -z "$STAGE_NAME" && "${MAJOR}${MINOR}${PATCH}" != "000" ]]; then
                echo "::error title=No prerelease::❌ The last tag $LAST_TAG is not a prerelease, so 'testing' has nothing to continue. Use patch, minor, or major."
                exit 1
              fi
              if [[ "$STAGE_NAME" == "$RELEASE_TYPE" ]]; then
                STAGE_NUM=$((STAGE_NUM + 1))
              else
                STAGE_NUM=1
              fi
              ;;
            *)
              echo "::error title=Invalid Bump Type::❌ Unknown bump type: $BUMP_TYPE"
              exit 1
              ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          if [[ "$RELEASE_TYPE" != "release" ]]; then
            [[ "$STAGE_NUM" -eq 0 ]] && STAGE_NUM=1
            NEW_VERSION="${NEW_VERSION}-${RELEASE_TYPE}.${STAGE_NUM}"
          fi

          {
            echo "new_tag=${NEW_VERSION}"
            echo "old_tag=${LAST_TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "::notice title=Version Computed::🔢 Target: ${NEW_VERSION} (from ${LAST_TAG})"
          echo "::endgroup::"

      - name: 🔎 Check that the release can start
        if: inputs.dry_run == false
        id: preflight
        shell: bash
        env:
          NEW_TAG: ${{ steps.versioning.outputs.new_tag }}
        run: |
          set -Eeuo pipefail
          echo "::group::🔎 Preflight checks"

          BRANCH="chore/changelog-${NEW_TAG}"

          if git rev-parse --verify --quiet "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "::error title=Tag exists::❌ The tag ${NEW_TAG} already exists"
            exit 1
          fi

          # Only a release opens the changelog pull request, so only a release can be blocked by one.
          if [[ "$RELEASE_TYPE" == "release" ]]; then
            OPEN_PRS=$(gh api "repos/${REPO}/pulls?state=open&head=${REPO%%/*}:${BRANCH}" \
              --jq 'length')
            if [[ "$OPEN_PRS" != "0" ]]; then
              echo "::error title=Changelog pull request open::❌ A pull request from ${BRANCH} is still open. Merge or close it, then run the workflow again."
              exit 1
            fi
          fi

          echo "::notice title=Preflight::✅ ${NEW_TAG} can be released"
          echo "::endgroup::"

      - name: 📝 Generate release notes
        id: release_notes
        shell: bash
        env:
          OLD_TAG: ${{ steps.versioning.outputs.old_tag }}
          NEW_TAG: ${{ steps.versioning.outputs.new_tag }}
        run: |
          set -Eeuo pipefail
          echo "::group::📝 Creating release notes"

          python3 - <<'PY'
          import datetime
          import os
          import re
          import subprocess

          repo = os.environ["REPO"]
          old_tag = os.environ["OLD_TAG"]
          new_tag = os.environ["NEW_TAG"]

          # An entry reads like an entry of CHANGELOG.md: the title of the pull request, the
          # commit on main, and the author, each with a link. The notes follow Keep a Changelog,
          # in the order of the style guide. feat is
          # Added, fix is Fixed (Security for fix(security)), and refactor, perf, and
          # revert are Changed. Every other type (docs, chore, ci, build, test, style,
          # or one that is not in the list) and a title without a type are Changed too,
          # but only when a person made the pull request: the pull requests of a bot
          # (the release, the contributors list, dependency updates) are left out.
          CATEGORIES = ("Added", "Changed", "Deprecated", "Removed", "Fixed", "Security")
          SUBJECT = re.compile(
              r"^(?P<type>[a-z]+)(?:\((?P<scope>[^)]*)\))?(?P<bang>!)?: (?P<text>.+)$"
          )


          def category(kind, scope, bot):
              if kind == "feat":
                  return "Added"
              if kind == "fix":
                  return "Security" if scope == "security" else "Fixed"
              if kind in ("refactor", "perf", "revert"):
                  return "Changed"
              return None if bot else "Changed"


          def run(*args):
              result = subprocess.run(args, capture_output=True, text=True)
              return result.returncode, result.stdout


          has_tag = run("git", "rev-parse", "--verify", "--quiet", f"refs/tags/{old_tag}")[0] == 0
          rev_range = f"{old_tag}..HEAD" if has_tag else "HEAD"

          # Every change reaches main through a pull request, so the list has one entry per
          # merged pull request: a merge commit ("Merge pull request #12") or a squash commit
          # ("feat(app): add export (#12)") on the first-parent line of main. A commit without
          # a pull request (a direct push) is listed on its own. The title of the pull request
          # is the text of the entry.
          log = run("git", "log", rev_range, "--first-parent", "--pretty=format:%H%x1f%s%x1f%an%x1f%P%x1f%b%x1e")[1]

          entries = {name: [] for name in CATEGORIES}
          seen = 0
          for record in [item.strip("\n") for item in log.split("\x1e") if item.strip()]:
              sha, subject, author_name, parents, body = (record.split("\x1f") + [""] * 5)[:5]
              seen += 1
              merge = re.match(r"^Merge pull request #(\d+)\b", subject)
              squash = re.search(r" \(#(\d+)\)$", subject)
              number = (merge or squash).group(1) if (merge or squash) else None

              title = subject
              login = ""
              bot = author_name.endswith("[bot]")
              if number:
                  code, out = run("gh", "api", f"repos/{repo}/pulls/{number}", "--jq", '[.title, .user.login, .user.type] | join("\u001f")')
                  fields = out.strip("\n").split("\x1f") if code == 0 else []
                  if len(fields) == 3 and fields[0]:
                      title, login, user_type = fields
                      bot = user_type == "Bot" or login.endswith("[bot]")
                  elif merge:
                      title = body.strip().splitlines()[0] if body.strip() else subject
                  title = re.sub(r" \(#\d+\)$", "", title)
              elif len(parents.split()) > 1:
                  continue

              match = SUBJECT.match(title)
              if match:
                  name = category(match["type"], match["scope"], bot)
              else:
                  # A title without a conventional type is a change of a person, unless a bot made it.
                  name = None if bot else "Changed"
              if name is None:
                  continue

              commit = f"[{sha[:7]}](https://github.com/{repo}/commit/{sha})"
              by = f" by [@{login}](https://github.com/{login})" if login and not bot else ""
              entries[name].append(f"- {title} {commit}{by}")


          def render():
              lines = [f"## {new_tag} ({datetime.date.today():%Y-%m-%d})", ""]
              listed = False
              for name in CATEGORIES:
                  if entries[name]:
                      listed = True
                      lines += [f"### {name}", ""] + entries[name] + [""]
              if not listed:
                  lines += ["- No notable changes.", ""]
              return lines


          changelog = render()
          notes = render()
          if has_tag:
              notes.append(f"##### Full Diff: https://github.com/{repo}/compare/{old_tag}...{new_tag}")

          with open("changelog_entry.tmp", "w", encoding="utf-8") as handle:
              handle.write("\n".join(changelog).rstrip("\n") + "\n")
          with open("release_notes.md", "w", encoding="utf-8") as handle:
              handle.write("\n".join(notes).rstrip("\n") + "\n")

          print(f"Entries in range: {seen}; listed: {sum(len(v) for v in entries.values())}")
          PY

          echo "::notice title=Release Notes::📝 Release notes generated for ${NEW_TAG}"
          echo "::endgroup::"

      - name: 📖 Update CHANGELOG file
        id: changelog
        shell: bash
        env:
          NEW_TAG: ${{ steps.versioning.outputs.new_tag }}
        run: |
          set -Eeuo pipefail
          echo "::group::📖 Updating CHANGELOG.md"

          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import re

          tag = os.environ["NEW_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")

          changelog = pathlib.Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8") if changelog.exists() else ""
          if not text.strip():
              text = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
          lines = text.splitlines()

          # Split the file into the part above [Unreleased], the [Unreleased] text, and the older versions.
          start = next((i for i, l in enumerate(lines) if re.fullmatch(r"## \[Unreleased\]\s*", l, re.I)), None)
          if start is None:
              first = next((i for i, l in enumerate(lines) if l.startswith("## ")), len(lines))
              head, unreleased, rest = lines[:first], [], lines[first:]
          else:
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
              head, unreleased, rest = lines[:start], lines[start + 1:end], lines[end:]

          # The text written by the maintainer in [Unreleased] wins; the commit list is the fallback.
          # Category headers without entries are removed, so a released section
          # lists only the categories that have entries.
          def drop_empty_sections(text):
              blocks = []
              head, body = None, []
              for line in text.splitlines() + ["### "]:
                  if line.startswith("### "):
                      content = "\n".join(body).strip("\n")
                      if content.strip():
                          blocks.append((head + "\n\n" if head else "") + content)
                      head, body = line.rstrip(), []
                  else:
                      body.append(line)
              return "\n\n".join(blocks)

          curated = drop_empty_sections("\n".join(unreleased).strip("\n"))
          generated = pathlib.Path("changelog_entry.tmp").read_text(encoding="utf-8").splitlines()
          if curated.strip():
              source, body = "the [Unreleased] text", curated
          else:
              source, body = "the commit list", "\n".join(generated[1:]).strip("\n")
          if not body.strip():
              source, body = "a placeholder", "- No notable changes."

          if curated.strip():
              notes = pathlib.Path("release_notes.md")
              diff = [l for l in notes.read_text(encoding="utf-8").splitlines() if l.startswith("##### Full Diff")]
              parts = [f"## {tag} ({today})", "", body, ""] + diff
              notes.write_text("\n".join(parts).rstrip("\n") + "\n", encoding="utf-8")

          head_text = "\n".join(head).rstrip("\n")
          tail_text = "\n".join(rest).strip("\n")
          out = (head_text + "\n\n" if head_text else "")
          out += "## [Unreleased]\n\n"
          out += f"## [{version}] - {today}\n\n{body}\n"
          if tail_text:
              out += "\n" + tail_text + "\n"
          changelog.write_text(out, encoding="utf-8")
          print(f"::notice title=Changelog source::📖 Release notes and changelog for {tag} use {source}")
          PY

          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error title=Changelog Error::❌ Failed to generate CHANGELOG.md"
            exit 1
          fi

          echo "::notice title=Changelog Updated::📖 CHANGELOG.md updated successfully"
          echo "::endgroup::"

      - name: 📦 Update package versions
        id: package_versions
        shell: bash
        env:
          NEW_TAG: ${{ steps.versioning.outputs.new_tag }}
        run: |
          set -Eeuo pipefail
          echo "::group::📦 Updating package.json and package-lock.json"

          # Each file is optional: a repository can have one, both, or none.
          python3 - <<'PY'
          import json
          import os
          import re

          version = os.environ["NEW_TAG"].removeprefix("v")
          changed = []


          def note(level, title, message):
              print(f"::{level} title={title}::{message}")


          for path in ("package.json", "package-lock.json"):
              if not os.path.isfile(path):
                  note("notice", "Not present", f"ℹ️ {path} is not present, so there is no version to update")
                  continue

              with open(path, encoding="utf-8") as handle:
                  text = handle.read()
              try:
                  before = json.loads(text)
              except json.JSONDecodeError as error:
                  note("warning", "Invalid JSON", f"⚠️ {path} is not valid JSON, so it was skipped: {error}")
                  continue

              new_text, count = re.subn(
                  r'^(  "version": ")[^"]*(")', rf"\g<1>{version}\g<2>", text, count=1, flags=re.MULTILINE
              )
              expected = json.loads(text)
              if count != 1 or "version" not in expected:
                  note("warning", "No version", f"⚠️ {path} has no top-level version, so it was skipped")
                  continue
              expected["version"] = version

              if path == "package-lock.json":
                  root = before.get("packages", {}).get("")
                  if root is not None and "version" in root:
                      marker = re.search(r'^    "": \{$', new_text, flags=re.MULTILINE)
                      if marker is None:
                          note("warning", "No root package", f"⚠️ The root package in {path} was not found, so it was skipped")
                          continue
                      head, tail = new_text[: marker.end()], new_text[marker.end():]
                      tail, count = re.subn(
                          r'^(      "version": ")[^"]*(")', rf"\g<1>{version}\g<2>", tail, count=1, flags=re.MULTILINE
                      )
                      if count != 1:
                          note("warning", "No root version", f"⚠️ The root package in {path} has no version, so it was skipped")
                          continue
                      new_text = head + tail
                      expected["packages"][""]["version"] = version

              if json.loads(new_text) != expected:
                  note("warning", "Unexpected change", f"⚠️ Updating {path} would change more than the version, so it was skipped")
                  continue

              if new_text == text:
                  note("notice", "Already current", f"ℹ️ {path} already has version {version}")
                  continue

              with open(path, "w", encoding="utf-8") as handle:
                  handle.write(new_text)
              changed.append(path)
              note("notice", "Version updated", f"📦 {path} now has version {version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"files={' '.join(changed)}\n")
          PY

          echo "::endgroup::"

      - name: 💾 Create pull request for CHANGELOG.md changes
        # A prerelease (alpha, beta, or rc) does not open a pull request: [Unreleased] stays as it is
        # and the next release moves its entries to the section of that release.
        if: inputs.dry_run == false && inputs.release_type == 'release'
        id: changelog_pr
        # The release does not depend on this pull request, so a failure here must not stop the release.
        continue-on-error: true
        shell: bash
        env:
          NEW_TAG: ${{ steps.versioning.outputs.new_tag }}
          PACKAGE_FILES: ${{ steps.package_versions.outputs.files }}
          BASE_BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          echo "::group::💾 Creating pull request for CHANGELOG.md"

          BRANCH="chore/changelog-${NEW_TAG}"

          BASE_SHA=$(gh api "repos/${REPO}/git/ref/heads/${BASE_BRANCH}" \
            --jq '.object.sha')

          # A failed earlier run can leave the branch behind: start again from the base branch.
          if gh api "repos/${REPO}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::warning title=Branch exists::⚠️ ${BRANCH} is left over from an earlier run; resetting it to ${BASE_SHA:0:7}"
            gh api --method PATCH "/repos/${REPO}/git/refs/heads/${BRANCH}" \
              -f sha="${BASE_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "/repos/${REPO}/git/refs" \
              -f ref="refs/heads/${BRANCH}" \
              -f sha="${BASE_SHA}" >/dev/null
          fi

          # One commit holds CHANGELOG.md and the package files that exist, so the
          # version in package.json and package-lock.json follows the release.
          export BASE_SHA BRANCH
          python3 - <<'PY'
          import base64
          import json
          import os

          files = ["CHANGELOG.md", *os.environ["PACKAGE_FILES"].split()]
          additions = []
          for path in files:
              with open(path, "rb") as handle:
                  additions.append({"path": path, "contents": base64.b64encode(handle.read()).decode()})

          query = (
              "mutation($input: CreateCommitOnBranchInput!) "
              "{ createCommitOnBranch(input: $input) { commit { oid } } }"
          )
          payload = {
              "query": query,
              "variables": {
                  "input": {
                      "branch": {"repositoryNameWithOwner": os.environ["REPO"], "branchName": os.environ["BRANCH"]},
                      "message": {"headline": f"chore(release): {os.environ['NEW_TAG']}"},
                      "expectedHeadOid": os.environ["BASE_SHA"],
                      "fileChanges": {"additions": additions},
                  }
              },
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "release_commit.json"), "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          print("Files in the commit: " + ", ".join(files))
          PY

          COMMIT_RESPONSE=$(gh api graphql --input "$RUNNER_TEMP/release_commit.json")
          COMMIT_SHA=$(echo "$COMMIT_RESPONSE" | jq -r '.data.createCommitOnBranch.commit.oid')
          echo "::notice title=Commit created::🔏 Commit ${COMMIT_SHA:0:7} created by github-actions[bot] at $(date -u)"

          VERIFIED=$(gh api "repos/${REPO}/commits/${COMMIT_SHA}" \
            --jq '.commit.verification.verified' 2>/dev/null || echo "false")

          if [[ "$VERIFIED" != "true" ]]; then
            echo "::warning title=Signature Warning::⚠️ Commit ${COMMIT_SHA:0:7} is not verified"
          else
            echo "::notice title=Signature Verified::🔏 Commit ${COMMIT_SHA:0:7} is verified"
          fi

          # The description follows .github/pull_request_template.md.
          PR_BODY=$(python3 .github/scripts/pull_request_body.py \
            --repo "${REPO}" \
            --type chore \
            --description "Updates \`CHANGELOG.md\` and the version in the package files for release **${NEW_TAG}**." \
            --steps "1. Open the **Files changed** tab.
          2. Check that the section for **${NEW_TAG}** in \`CHANGELOG.md\` lists the right changes.
          3. Check that \`package.json\` and \`package-lock.json\` (where present) have the version of **${NEW_TAG}**." \
            --notes "Automatically generated by the [Release Manager](${RUN_URL}) workflow.

          > [!IMPORTANT]
          >
          > Merge this pull request **after** the release has been published.")

          if ! PR_RESPONSE=$(gh api --method POST "/repos/${REPO}/pulls" \
            -f title="chore(release): ${NEW_TAG}" \
            -f head="${BRANCH}" \
            -f base="${BASE_BRANCH}" \
            -f body="${PR_BODY}" 2>&1); then
            echo "$PR_RESPONSE"
            echo "::error title=Pull request failed::❌ The changelog pull request could not be created, but the release continues. Check that Settings, Actions, General, Workflow permissions allows GitHub Actions to create pull requests. The changelog commit is on ${BRANCH}: open the pull request from there."
            exit 1
          fi

          PR_URL=$(echo "${PR_RESPONSE}" | jq -r '.html_url')
          PR_NUMBER=$(echo "${PR_RESPONSE}" | jq -r '.number')

          echo "::notice title=PR Created::✅ Pull request created: ${PR_URL}"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

          # The pull request author cannot review its own pull request, so a refusal is only a warning.
          if REVIEW_RESPONSE=$(gh api --method POST "/repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f "reviewers[]=${REVIEWER}" 2>&1); then
            echo "::notice title=Reviewer requested::👀 Review requested from ${REVIEWER}"
          else
            echo "${REVIEW_RESPONSE}"
            echo "::warning title=Reviewer not requested::⚠️ Review could not be requested from ${REVIEWER} on #${PR_NUMBER}."
          fi
          echo "::endgroup::"

      - name: 🚀 Create GitHub release
        if: inputs.dry_run == false
        id: push_step
        shell: bash
        env:
          NEW_TAG: ${{ steps.versioning.outputs.new_tag }}
        run: |
          set -Eeuo pipefail
          echo "::group::💾 Publishing release"

          # Alpha, beta, and rc are prereleases and never Latest. A release is Latest.
          PRERELEASE_FLAG=""
          LATEST_FLAG="--latest"
          if [[ "$RELEASE_TYPE" != "release" ]]; then
            PRERELEASE_FLAG="--prerelease"
            LATEST_FLAG="--latest=false"
          fi

          gh release create "$NEW_TAG" \
            --target "${GITHUB_REF_NAME}" \
            --title "$NEW_TAG" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG \
            $LATEST_FLAG

          echo "::notice title=Release Created::✅ ${NEW_TAG} published successfully"
          echo "::endgroup::"

      - name: 📣 Post announcement to GitHub Discussions
        if: >-
          inputs.dry_run == false && inputs.post_announcement == true && steps.push_step.outcome == 'success'
        id: announcement
        shell: bash
        env:
          NEW_TAG: ${{ steps.versioning.outputs.new_tag }}
        run: |
          set -Eeuo pipefail
          echo "::group::📣 Posting announcement to GitHub Discussions"

          RELEASE_URL="https://github.com/${REPO}/releases/tag/${NEW_TAG}"

          REPO_ID=$(gh api graphql \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) { id }
            }' \
            -f owner="${REPO%%/*}" \
            -f name="${REPO##*/}" \
            --jq ".data.repository.id")

          if [[ -z "$REPO_ID" ]]; then
            echo "::error title=GraphQL Error::❌ Could not resolve repository node ID"
            exit 1
          fi

          CATEGORY_ID=$(gh api graphql \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                discussionCategories(first: 25) {
                  nodes { id name }
                }
              }
            }' \
            -f owner="${REPO%%/*}" \
            -f name="${REPO##*/}" \
            --jq '.data.repository.discussionCategories.nodes[]
                  | select(.name == "Announcements") | .id')

          if [[ -z "$CATEGORY_ID" ]]; then
            echo "::error title=Category Not Found::❌ Could not find the Announcements discussion category"
            exit 1
          fi

          RELEASE_NOTES_BODY=$(cat release_notes.md)

          ANNOUNCEMENT_TITLE="🚀 Release ${NEW_TAG}"

          ANNOUNCEMENT_BODY="## 📣 ${NEW_TAG} has been released!

          We are happy to announce the release of **${NEW_TAG}**.

          ${RELEASE_NOTES_BODY}

          ---

          📦 **[View the full release on GitHub](${RELEASE_URL})**

          Thank you to everyone who contributed to this release! 🙏"

          ESCAPED_BODY=$(printf '%s' "$ANNOUNCEMENT_BODY" \
            | sed 's/\\/\\\\/g; s/"/\\"/g; s/$/\\n/' \
            | tr -d '\n')

          DISCUSSION_URL=$(gh api graphql \
            -f query="mutation {
              createDiscussion(input: {
                repositoryId: \"${REPO_ID}\",
                categoryId: \"${CATEGORY_ID}\",
                title: \"${ANNOUNCEMENT_TITLE}\",
                body: \"${ESCAPED_BODY}\"
              }) {
                discussion { url }
              }
            }" \
            --jq '.data.createDiscussion.discussion.url')

          if [[ -z "$DISCUSSION_URL" ]]; then
            echo "::error title=Discussion Error::❌ Failed to create announcement discussion"
            exit 1
          fi

          echo "discussion_url=${DISCUSSION_URL}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Announcement Posted::📣 Discussion created at ${DISCUSSION_URL}"
          echo "::endgroup::"

      - name: 📊 Generate job summary
        if: always()
        shell: bash
        env:
          VER_STATUS: ${{ steps.versioning.outcome == 'success' && '✅ Success' || '❌ Failed' }}
          LOG_STATUS: ${{ steps.changelog.outcome == 'success' && '✅ Success' || '❌ Failed' }}
          OVERALL_ICON: ${{ job.status == 'success' && steps.changelog_pr.outcome != 'failure' && '✅' || '❌' }}
          DISCUSSION_URL: ${{ steps.announcement.outputs.discussion_url || '' }}
          PR_URL: ${{ steps.changelog_pr.outputs.pr_url || '' }}
          OLD_TAG: ${{ steps.versioning.outputs.old_tag || 'N/A' }}
          NEW_TAG: ${{ steps.versioning.outputs.new_tag || 'N/A' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEP_CHANGELOG_PR_OUTCOME: ${{ steps.changelog_pr.outcome }}
          STEP_PUSH_STEP_OUTCOME: ${{ steps.push_step.outcome }}
          STEP_ANNOUNCEMENT_OUTCOME: ${{ steps.announcement.outcome }}
        run: |
          set -Eeuo pipefail
          echo "::group::📊 Generating Summary Report"

          if [[ "$DRY_RUN" == "true" ]]; then
            PR_STATUS="⏭️ Skipped (dry run)"
            REL_STATUS="⏭️ Skipped (dry run)"
          else
            case "${STEP_CHANGELOG_PR_OUTCOME}" in
              success) PR_STATUS="✅ Success" ;;
              skipped) PR_STATUS="⏭️ Skipped (prerelease)" ;;
              *) PR_STATUS="❌ Failed" ;;
            esac

            if [[ "${STEP_PUSH_STEP_OUTCOME}" == "success" ]]; then
              REL_STATUS="✅ Success"
            else
              REL_STATUS="❌ Failed"
            fi
          fi

          if [[ "${STEP_ANNOUNCEMENT_OUTCOME}" == "success" ]]; then
            ANN_STATUS="✅ Success"
          elif [[ "${STEP_ANNOUNCEMENT_OUTCOME}" == "skipped" ]]; then
            ANN_STATUS="⏭️ Skipped"
          else
            ANN_STATUS="❌ Failed"
          fi

          ANN_LINK=""
          if [[ -n "$DISCUSSION_URL" ]]; then
            ANN_LINK=" — [View Discussion](${DISCUSSION_URL})"
          fi

          PR_LINK=""
          if [[ -n "$PR_URL" ]]; then
            PR_LINK=" — [View PR](${PR_URL})"
          fi

          EXEC_TIME="$(date -u)"

          PR_NOTE=""
          if [[ "${STEP_CHANGELOG_PR_OUTCOME}" == "failure" ]]; then
            PR_NOTE="- **Changelog pull request failed.** The release was still published. Check that Settings, Actions, General, Workflow permissions allows GitHub Actions to create pull requests, then open the pull request from the \`chore/changelog-${NEW_TAG}\` branch."
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ${OVERALL_ICON} Release Process Summary

          Execution completed at: ${EXEC_TIME}

          ### 📈 Pipeline Results

          | Phase            | Status                   | Action              |
          | :--------------- | :----------------------: | :------------------ |
          | 🔢 Versioning    | ${VER_STATUS}            | Calculate New Tag   |
          | 📖 Documentation | ${LOG_STATUS}            | Generate Changelog  |
          | 💾 Pull Request  | ${PR_STATUS}${PR_LINK}   | Create Changelog PR |
          | 🚀 Distribution  | ${REL_STATUS}            | GH CLI Release      |
          | 📣 Announcement  | ${ANN_STATUS}${ANN_LINK} | Post to Discussions |

          ### ⚙️ Runtime Configuration

          - **Current Tag:** \`${OLD_TAG}\`
          - **Target Tag:** \`${NEW_TAG}\`
          - **Bump Mode:** \`${BUMP_TYPE}\`
          - **Release Type:** \`${RELEASE_TYPE}\`
          - **Dry Run:** \`${DRY_RUN}\`
          - **Post Announcement:** \`${POST_ANNOUNCEMENT}\`

          ### 🧩 Notes

          - **Repository:** ${REPO}
          - **Workflow Run:** [View Details](${RUN_URL})
          ${PR_NOTE}
          EOF

          echo "::endgroup::"
