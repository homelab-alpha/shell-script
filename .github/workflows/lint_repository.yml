---
name: 🔍 Lint Repository

# Runs Super Linter on the whole repository on pushes to main and by hand. The linters and their
# settings are in .github/super_linter.env and .github/linters/. Pull requests run the lighter
# lint_pull_request.yml instead.

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: >
    ${{
      github.event_name == 'push' &&
      format('linting-push-{0}', github.ref) ||
      format('linting-manual-{0}', github.run_id)
    }}
  cancel-in-progress: true

# No permission for the workflow as a whole. Each job asks for what it needs.
permissions: {}

jobs:
  lint:
    name: 🔍 Perform Linting Analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    # Also skips the push that creates the repository from the template: the Initialize Repository
    # workflow replaces that history, so nothing should run for it.
    if: |
      github.event.created != true

    permissions:
      contents: read
      packages: read # Needed by Super-linter to read GitHub Packages.
      statuses: write # Super-linter reports a status for each linter.

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 🏁 Notify start of process
        run: |
          echo "::notice title=Workflow started::🔍 Linting started"
          echo "::group::ℹ️ Execution context"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Workflow ref: $GITHUB_REF"
          echo "Runner OS: ${RUNNER_OS}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "::endgroup::"

      - name: 🏁 Checkout repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📥 Extract Super-Linter environment
        id: load_env
        run: |
          echo "::group::📄 Loading environment variables"

          if [ -f .github/super_linter.env ]; then
            VARIABLES=$(grep -vE '^\s*#|^\s*$' .github/super_linter.env || true)

            if [ -n "$VARIABLES" ]; then
              echo "$VARIABLES" >> "$GITHUB_ENV"
              echo "The following variables were loaded:"
              echo "$VARIABLES"
              echo "env_loaded=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=Environment loaded::ℹ️ Super-Linter environment loaded successfully"
            else
              echo "env_loaded=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=No Active Configuration::ℹ️ super_linter.env contains no active variables"
            fi
          else
            echo "env_loaded=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Environment Missing::⚠️ No .github/super_linter.env file found"
          fi

          echo "::endgroup::"

      - name: 🏃 Run Super-Linter
        id: run_linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚨 Log linting failure
        if: failure() && steps.run_linter.outcome == 'failure'
        run: |
          echo "::error title=Linting failed::❌ Super-Linter found issues in the codebase. Check the logs above for details."

      - name: 📊 Generate job summary
        if: always()
        env:
          LINT_RESULT:
            ${{ steps.run_linter.outcome == 'success' && '✅ Success' || steps.run_linter.outcome == 'failure' && '❌
            Failed' || '⏭️ Skipped' }}
          ENV_RESULT: ${{ steps.load_env.outcome == 'success' && '✅ Success' || '❌ Failed' }}
        run: |
          echo "::group::📊 Generating Summary Report"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🔍 Linting Summary

          Execution completed at: $(date -u)

          ### 📈 Execution Results

          | Target          | Action   | Result       |
          | :-------------- | :------- | :----------- |
          | 📄 Environment  | Loaded   | $ENV_RESULT  |
          | 🔍 Super-Linter | Executed | $LINT_RESULT |

          ### ⚙️ Runtime Configuration

          - **Branch/Ref:** $GITHUB_REF
          - **Default Branch:** ${DEFAULT_BRANCH:-main}
          - **Runner OS:** $RUNNER_OS
          - **Event:** ${GITHUB_EVENT_NAME}
          - **Log Level:** ${LOG_LEVEL:-NOTICE}

          ### 🧩 Notes

          - Automated linting performed via \`super-linter/super-linter@v9.0.0\`.
          - Workflow Run: [View Details](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          echo "::endgroup::"
