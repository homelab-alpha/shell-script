---
name: ⚔️ Detect Merge Conflicts

# Labels a pull request that has a merge conflict ("PR: please resolve merge conflict") and comments
# on it. It runs when a pull request is updated and on pushes to main, because those can make other
# pull requests conflict. It retries up to 5 times, 60 seconds apart, while GitHub works out whether
# a pull request can be merged. It uses eps1lon/actions-label-merge-conflict, which the policy
# approves.

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - synchronize

# No permission for the workflow as a whole. Each job asks for what it needs.
permissions: {}

concurrency:
  group: conflict-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-conflicts:
    name: 🔍 Detect merge conflicts
    # Also skips the push that creates the repository from the template: the Initialize Repository
    # workflow replaces that history, so nothing should run for it.
    if: |
      github.event.created != true
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      issues: write # Add and remove the conflict label (labels belong to the issues API).
      pull-requests: write # Comment on the pull request about the conflict.

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RETRY_AFTER: 60
      RETRY_MAX: 5

    steps:
      - name: 🏁 Notify start of process
        env:
          EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 'N/A' }}
        run: |
          set -Eeuo pipefail
          echo "::notice title=Workflow started::🔍 Merge conflict detection started"
          echo "::group::ℹ️ Execution context"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "PR Number: ${EVENT_PULL_REQUEST_NUMBER}"
          echo "Runner OS: ${RUNNER_OS}"
          echo "::endgroup::"

      - name: 🔍 Check for merge conflicts
        id: conflict_check
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}

          retryAfter: ${{ env.RETRY_AFTER }}
          retryMax: ${{ env.RETRY_MAX }}

          dirtyLabel: "PR: please resolve merge conflict"
          commentOnDirty: |
            ## ⚠️ Merge conflicts detected

            This pull request contains merge conflicts that must be resolved before it can be reviewed or merged.

            ### 🔧 How to resolve them

            1. Update your local branch with the latest changes from the target branch (by rebasing or merging, depending on your workflow).
            2. Open each conflicted file and resolve the conflicts. Look for conflict markers like:
                ```none
                Accept Current Change | Accept Incoming Change | Accept Both Changes | Compare Changes
                <<<<<<< your-branch-name (current changes)
                This is a example.
                =======
                This is a example!
                >>>>>>> main (incoming changes)
                ```
            3. Remove the conflict markers and keep the correct changes.
            4. Save the files and ensure the project builds and all tests pass.
            5. Commit the resolved changes.
            6. Push your branch to update this pull request.

            ⏳ Once the conflicts are resolved, the pull request will automatically update.

            Thanks for taking care of this! 🚀

          removeOnDirtyLabel: ""
          commentOnClean: |
            ## ✅ Merge conflicts resolved

            All merge conflicts in this pull request have been successfully resolved. 🎉

            Thanks for the collaboration! 🙌

      - name: 🚨 Handle workflow failure
        if: failure()
        run: |
          set -Eeuo pipefail
          echo "::error title=Conflict Check Failed::❌ The conflict detection action encountered a technical error."

      - name: 📊 Generate job summary
        if: always()
        env:
          CHECK_STATUS: ${{ steps.conflict_check.outcome == 'success' && '✅ Success' || '❌ Failed' }}
        run: |
          set -Eeuo pipefail
          echo "::group::📊 Generating Summary Report"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚔️ Merge Conflict Detection Summary

          Execution completed at: $(date -u)

          ### 📈 Execution Results

          | Target          | Action         | Result        |
          | :-------------- | :------------: | :------------ |
          | 🔀 Pull Request | Conflict Check | $CHECK_STATUS |

          ### ⚙️ Runtime Configuration

          - **Target Branch:** main
          - **Timeout:** 15 min
          - **Retry After:** ${RETRY_AFTER} sec
          - **Retry Max:** ${RETRY_MAX}

          ### 🧩 Notes

          - **Exception:** \`eps1lon/actions-label-merge-conflict@v3.1.0\` (approved per ENG-CI-001)
          - If "Failed", check logs for API rate limits or permission issues.
          - Workflow Run: [View Details](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          echo "::endgroup::"
