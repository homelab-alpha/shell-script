---
name: 🛡️ CodeQL Security Analysis

# CodeQL code scanning. It runs on pushes and pull requests to main, every Sunday, and by hand. It
# analyzes the GitHub Actions workflows; add a language to the matrix when the repository has source
# code for it, because CodeQL fails when it finds nothing to analyze. Code scanning must be available
# for the repository (a private repository needs GitHub Code Security); switch this workflow off in the
# Actions settings when it is not.

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 3 * * 0"

  workflow_dispatch:

# No permission for the workflow as a whole. Each job asks for what it needs.
permissions: {}

concurrency:
  group: codeql-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    name: 🔍 Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-26') || 'ubuntu-26.04' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}

    # Also skips the push that creates the repository from the template: the Initialize Repository
    # workflow replaces that history, so nothing should run for it.
    if: |
      github.event.created != true

    permissions:
      security-events: write # Upload the CodeQL results to code scanning.
      packages: read # Download CodeQL query packs (needed on a private repository).
      actions: read # Read the workflow run details (needed on a private repository).
      contents: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # Add a language only when the repository has source code for it,
          # because CodeQL fails when it finds no code to analyze.
          # javascript-typescript covers the JavaScript in develop/.
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: 🏁 Notify start of analysis
        env:
          MATRIX_LANGUAGE: ${{ matrix.language }}
          MATRIX_BUILD_MODE: ${{ matrix.build-mode }}
        run: |
          echo "::notice title=CodeQL Started::🔍 Starting security scan for ${MATRIX_LANGUAGE}"
          echo "::group::ℹ️ Environment Details"
          echo "Language: ${MATRIX_LANGUAGE}"
          echo "Build Mode: ${MATRIX_BUILD_MODE}"
          echo "Runner: ${RUNNER_OS}"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "::endgroup::"

      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏗️ Initialize CodeQL
        id: codeql_init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: 🛠️ Execute manual build
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo "::group::🔨 Build Instructions"
          echo "Manual build mode detected."
          echo "Replace this step with your build commands, for example:"
          echo "  make bootstrap"
          echo "  make release"
          echo "::endgroup::"
          echo "::error title=Build Required::❌ Manual build mode detected but no build commands provided."
          exit 1

      - name: 🧪 Perform CodeQL analysis
        id: codeql_analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

      - name: 🚨 Log analysis failure
        if: failure()
        env:
          MATRIX_LANGUAGE: ${{ matrix.language }}
        run: |
          echo "::error title=CodeQL Failed::❌ CodeQL analysis failed for ${MATRIX_LANGUAGE}. Check the logs for details."

      - name: 📊 Generate job summary
        if: always()
        env:
          INIT_STATUS: ${{ steps.codeql_init.outcome == 'success' && '✅ Success' || '❌ Failed' }}
          ANALYSIS_STATUS: ${{ steps.codeql_analysis.outcome == 'success' && '✅ Success' || '❌ Failed' }}
          MATRIX_LANGUAGE: ${{ matrix.language }}
          MATRIX_BUILD_MODE: ${{ matrix.build-mode }}
        run: |
          echo "::group::📊 Generating Summary Report"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🛡️ CodeQL Analysis Summary

          Execution completed at: $(date -u)

          ### 📈 Scan Results

          | Component         | Detail                | Result           |
          | :---------------- | :-------------------- | :--------------- |
          | 🏗️ Initialization | CodeQL database setup | $INIT_STATUS     |
          | 🔐 Security Scan  | ${MATRIX_LANGUAGE}    | $ANALYSIS_STATUS |
          | ⚙️ Build Mode     | ${MATRIX_BUILD_MODE}  | ✅ Configured    |

          ### ⚙️ Runtime Configuration

          - **Language:** ${MATRIX_LANGUAGE}
          - **Build Mode:** ${MATRIX_BUILD_MODE}
          - **Runner OS:** ${RUNNER_OS}
          - **Database Category:** /language:${MATRIX_LANGUAGE}
          - **Ref:** ${GITHUB_REF}

          ### 🧩 Notes

          - Results are uploaded to the **Security** tab under Code Scanning alerts.
          - Workflow Run: [View Details](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          echo "::endgroup::"
