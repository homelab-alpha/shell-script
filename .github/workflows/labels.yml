---
name: 🏷️ Synchronize Repository Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/labels.yml

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: labels-${{ github.repository || github.run_id }}
  cancel-in-progress: true

jobs:
  labels:
    name: 🏷️ Manage Labels
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: |
      github.event.sender.type != 'Bot' &&
      !contains(github.actor, '[bot]')

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

      DRY_RUN: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}

      LABELS_FILE: .github/labels.yml

    steps:
      - name: 🏁 Notify start of process
        run: |
          echo "::notice title=Workflow started::🏷️ Label synchronization initiated"
          echo "::group::ℹ️ Execution context"
          echo "Repository: $REPO"
          echo "Mode: $( [ "$DRY_RUN" = "true" ] && echo "DRY-RUN" || echo "ACTIVE" )"
          echo "Triggered by: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "::endgroup::"

      - name: 📦 Checkout labels configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/labels.yml

      - name: ℹ️ Load desired labels
        id: load_labels
        run: |
          set -Eeuo pipefail
          echo "::group::ℹ️ Loading desired labels"

          if [ ! -f "$LABELS_FILE" ]; then
            echo "::error title=Configuration missing::❌ The file $LABELS_FILE was not found"
            exit 1
          fi

          yq -o=json '.' "$LABELS_FILE" | jq 'unique_by(.name)' > /tmp/desired-labels.json

          DESIRED_COUNT=$(jq '. | length' /tmp/desired-labels.json)
          echo "desired_count=$DESIRED_COUNT" >> "$GITHUB_OUTPUT"
          echo "::notice title=Labels loaded::ℹ️ $DESIRED_COUNT labels found in $LABELS_FILE"

          jq -r '.[].name' /tmp/desired-labels.json

          echo "::endgroup::"

      - name: 🔍 Fetch existing repository labels
        id: fetch_labels
        run: |
          set -Eeuo pipefail
          echo "::group::🔍 Fetching existing labels"

          if ! gh label list --repo "$REPO" --limit 5000 --json name,color,description > /tmp/existing-labels.json; then
            echo "::error title=GitHub API failure::❌ Could not fetch labels from $REPO"
            exit 1
          fi

          EXISTING_COUNT=$(jq '. | length' /tmp/existing-labels.json)
          echo "existing_count=$EXISTING_COUNT" >> "$GITHUB_OUTPUT"
          echo "::notice title=Labels fetched::ℹ️ $EXISTING_COUNT existing labels found in $REPO"

          jq -r '.[].name' /tmp/existing-labels.json

          echo "::endgroup::"

      - name: 🔄 Synchronize labels
        id: sync_labels
        run: |
          set -Eeuo pipefail
          echo "::group::🔄 Creating or updating labels"

          CREATED=0
          UPDATED=0
          SKIPPED=0

          # Retry a write a few times. The GitHub API can reject a burst of writes
          # for a short time, and waiting is enough to get through.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              echo "::warning title=Retrying::⚠️ Attempt $attempt of 3 failed: ${*:1:3}"
              sleep $((attempt * 5))
            done
            return 1
          }

          jq -r '.[].name' /tmp/existing-labels.json > /tmp/existing-names.txt

          while read -r row <&3; do
            NAME=$(jq -r '.name' <<< "$row")
            COLOR=$(jq -r '.color | ascii_downcase | ltrimstr("#")' <<< "$row")
            DESC=$(jq -r '.description // ""' <<< "$row")

            if grep -Fxq "$NAME" /tmp/existing-names.txt; then
              CURRENT=$(jq -c --arg n "$NAME" \
                '.[] | select(.name == $n) | {color: (.color | ascii_downcase), description: (.description // "")}' \
                /tmp/existing-labels.json)
              WANTED=$(jq -cn --arg c "$COLOR" --arg d "$DESC" '{color: $c, description: $d}')

              if [ "$CURRENT" = "$WANTED" ]; then
                echo "⏭️ Unchanged: $NAME"
                SKIPPED=$((SKIPPED + 1))
                continue
              fi

              if [ "$DRY_RUN" != "true" ]; then
                if ! retry gh label edit "$NAME" --repo "$REPO" --color "$COLOR" --description "$DESC"; then
                  echo "::error title=Label update failed::❌ Failed to update label '$NAME'"
                  exit 1
                fi
                echo "::notice title=Label updated::🔄 Label '$NAME' updated by github-actions[bot] at $(date -u)"
                sleep 1
              else
                echo "ℹ️ Dry-run: would update label '$NAME'"
              fi
              UPDATED=$((UPDATED + 1))
            else
              if [ "$DRY_RUN" != "true" ]; then
                if ! retry gh label create "$NAME" --repo "$REPO" --color "$COLOR" --description "$DESC"; then
                  echo "::error title=Label creation failed::❌ Failed to create label '$NAME'"
                  exit 1
                fi
                echo "::notice title=Label created::🏷️ Label '$NAME' created by github-actions[bot] at $(date -u)"
                sleep 1
              else
                echo "ℹ️ Dry-run: would create label '$NAME'"
              fi
              CREATED=$((CREATED + 1))
            fi
          done 3< <(jq -c '.[]' /tmp/desired-labels.json)

          {
            echo "created=$CREATED"
            echo "updated=$UPDATED"
            echo "skipped=$SKIPPED"
          } >> "$GITHUB_OUTPUT"

          echo "::endgroup::"

      - name: 🧹 Remove obsolete labels
        id: cleanup_labels
        run: |
          set -Eeuo pipefail
          echo "::group::🧹 Removing obsolete labels"

          DELETED=0

          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning title=Cleanup dry-run::⚠️ No labels will be deleted (dry-run mode is active)"
          fi

          jq -r '.[].name' /tmp/desired-labels.json > /tmp/desired-names.txt

          while read -r LABEL <&3; do
            if ! grep -Fxq "$LABEL" /tmp/desired-names.txt; then
              echo "🗑️ Label not defined in $LABELS_FILE: $LABEL"

              if [ "$DRY_RUN" != "true" ]; then
                if gh label delete "$LABEL" --repo "$REPO" --yes; then
                  echo "::notice title=Label deleted::🗑️ Label '$LABEL' deleted by github-actions[bot] at $(date -u)"
                  sleep 1
                else
                  echo "::warning title=Label delete failed::⚠️ Label '$LABEL' may have already been removed"
                fi
              else
                echo "ℹ️ Dry-run: would delete label '$LABEL'"
              fi
              DELETED=$((DELETED + 1))
            fi
          done 3< <(jq -r '.[].name' /tmp/existing-labels.json)

          echo "deleted=$DELETED" >> "$GITHUB_OUTPUT"

          echo "::endgroup::"

      - name: 📊 Generate job summary
        if: always()
        run: |
          set -Eeuo pipefail
          echo "::group::📊 Generating summary report"

          LOAD_STATUS="${{ steps.load_labels.outcome == 'success' && '✅ Success' || '❌ Failed' }}"
          FETCH_STATUS="${{ steps.fetch_labels.outcome == 'success' && '✅ Success' || '❌ Failed' }}"
          SYNC_STATUS="${{ steps.sync_labels.outcome == 'success' && '✅ Success' || '❌ Failed' }}"
          CLEAN_STATUS="${{ steps.cleanup_labels.outcome == 'success' && '✅ Success' || '❌ Failed' }}"

          DESIRED_COUNT="${{ steps.load_labels.outputs.desired_count || '0' }}"
          EXISTING_COUNT="${{ steps.fetch_labels.outputs.existing_count || '0' }}"
          CREATED="${{ steps.sync_labels.outputs.created || '0' }}"
          UPDATED="${{ steps.sync_labels.outputs.updated || '0' }}"
          SKIPPED="${{ steps.sync_labels.outputs.skipped || '0' }}"
          DELETED="${{ steps.cleanup_labels.outputs.deleted || '0' }}"

          if [ "$DRY_RUN" = "true" ]; then
            MODE_BLOCK=$'> [!IMPORTANT]\n>\n> **Mode: Dry-run** — No changes were applied to the repository.'
          else
            MODE_BLOCK=$'### ✅ Mode: Active\n\nRepository labels have been synchronized with `'"$LABELS_FILE"'`.'
          fi

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🏷️ Label Synchronization Summary

          Execution completed at: $(date -u)

          $MODE_BLOCK

          ### 📈 Execution Results

          | Task              | Result        |
          | :---------------- | :------------ |
          | ℹ️ Load Config    | $LOAD_STATUS  |
          | 🔍 Fetch Existing | $FETCH_STATUS |
          | 🔄 Sync Labels    | $SYNC_STATUS  |
          | 🧹 Cleanup        | $CLEAN_STATUS |

          ### 📊 Metrics

          | Metric               | Value           |
          | :------------------- | :-------------- |
          | 🔍 Configured Labels | $DESIRED_COUNT  |
          | 🏷️ Existing Labels   | $EXISTING_COUNT |
          | ✅ Created           | $CREATED        |
          | 🔄 Updated           | $UPDATED        |
          | ⏭️ Unchanged         | $SKIPPED        |
          | 🗑️ Deleted           | $DELETED        |

          ### ⚙️ Runtime Configuration

          - **Repository:** $REPO
          - **Config Path:** $LABELS_FILE
          - **Triggered By:** ${{ github.actor }}
          - **Workflow Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          echo "::endgroup::"
