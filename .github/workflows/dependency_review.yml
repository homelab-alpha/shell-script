---
name: 🔒 Dependency Review

# Reviews the dependency changes of a pull request to main with actions/dependency-review-action. It
# fails on vulnerabilities of moderate severity or higher and on licenses that are not in the
# allow-licenses list below, and it comments on the pull request when it fails. Add the SPDX
# identifier of a license to the list to allow it.

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

# No permission for the workflow as a whole. Each job asks for what it needs.
permissions: {}

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: 🔒 Scan Dependencies for Vulnerabilities
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write # Let the action comment the summary on the pull request when it fails.

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 🏁 Notify start of process
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "::notice title=Workflow started::🔒 Dependency review started for PR #${PR_NUMBER}"
          echo "::group::ℹ️ Execution context"
          echo "Repository: ${REPO}"
          echo "PR Number:  ${PR_NUMBER}"
          echo "Base ref:   ${BASE_REF}"
          echo "Head ref:   ${HEAD_REF}"
          echo "::endgroup::"

      - name: 🏁 Checkout repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔒 Run Dependency Review
        id: dependency_review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          comment-summary-in-pr: on-failure
          allow-licenses:
            MIT, MIT-0, MIT-CMU, MIT-Modern-Variant, MIT-open-group, MIT-feh, MIT-enna, MIT-Festival, MITNFA, X11, Xnet,
            Fair, BSD-1-Clause, BSD-2-Clause, BSD-3-Clause, BSD-3-Clause-Clear, BSD-2-Clause-Patent, 0BSD, Apache-2.0,
            Apache-2.0 WITH LLVM-exception, ECL-2.0, ISC, Zlib, libpng-2.0, curl, NCSA, HPND, NTP, BSL-1.0, PostgreSQL,
            UPL-1.0, PSF-2.0, Python-2.0, BlueOak-1.0.0, MulanPSL-2.0, ZPL-2.1, Unlicense, CC0-1.0, CC-BY-NC-SA-4.0

          # Individual exceptions, by package URL. A package here may use any license.
          # - pkg:golang/github.com/twbs/bootstrap: https://github.com/homelab-alpha/docs/actions/runs/43231652736
          # - pkg:npm/spdx-exceptions: CC-BY-3.0 (attribution only), a development dependency in the lockfile
          allow-dependencies-licenses: pkg:golang/github.com/twbs/bootstrap, pkg:npm/spdx-exceptions

      - name: 🚨 Log dependency review failure
        if: failure()
        run: |
          echo "::error title=Dependency Review Failed::❌ One or more dependencies introduced in this PR contain known vulnerabilities or use licenses that are not on the allowlist. Check the PR comment for details."

      - name: 📊 Generate job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "::group::📊 Generating Summary Report"

          if [[ "${JOB_STATUS}" == "success" ]]; then
            REVIEW_RESULT="✅ No issues found"
          else
            REVIEW_RESULT="❌ Issues detected"
          fi

          cat <<EOF >> "${GITHUB_STEP_SUMMARY}"
          ## 🔒 Dependency Review Summary

          Execution completed at: $(date -u)

          ### 📈 Execution Results

          | Metric                | Value                             | Result           |
          | :-------------------- | :-------------------------------- | :--------------- |
          | 🔍 Vulnerability Scan | Severity threshold: moderate      | ${REVIEW_RESULT} |
          | 📜 License Check      | Allowlist enforced (see workflow) | ${REVIEW_RESULT} |

          ### ⚙️ Runtime Configuration

          - **Base Ref:** ${BASE_REF}
          - **Head Ref:** ${HEAD_REF}
          - **PR Number:** #${PR_NUMBER}
          - **Workflow Run:** [View Details](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})

          ### 🧩 Notes

          - Powered by \`actions/dependency-review-action\`.
          - A detailed report is posted as a comment on the pull request when the review fails.
          - To allow a specific license, add its SPDX identifier to the \`allow-licenses\` list in \`.github/workflows/dependency_review.yml\`.
          EOF

          echo "::endgroup::"
