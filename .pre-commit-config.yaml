---
# Pre-commit hook configuration
# Run locally: pre-commit run --all-files
# Install:     pip install pre-commit && pre-commit install
# Docs:        https://pre-commit.com

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Ensure files end with a newline
      - id: check-yaml
        name: Validate YAML syntax
      - id: check-json
        name: Validate JSON syntax
      - id: check-merge-conflict
        name: Detect unresolved merge conflict markers
      - id: check-added-large-files
        name: Prevent committing large files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        name: Enforce consistent line endings (LF)
        args: [--fix=lf]
      - id: detect-private-key
        name: Detect accidentally committed private keys

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: [--config-file, .github/linters/.yaml-lint.yml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f # frozen: v0.50.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: [--config, .github/linters/.markdown-lint.yml]
